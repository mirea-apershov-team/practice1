name: .NET 8 Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Practice2/Practice2.csproj

      - name: Build
        run: dotnet build Practice2/Practice2.csproj --configuration Release --no-restore

      - name: Run application
        run: dotnet run --project Practice2/Practice2.csproj --configuration Release --no-build
